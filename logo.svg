<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="CPB">
  <title>Contact Probability Block</title>
  <!-- Tasteful I-D mark: a bundle (stacked blocks) on an uncertain hop. -->
  <rect width="160" height="160" rx="16" fill="#f6f3ee"/>
  <!-- faint orbit -->
  <circle cx="80" cy="78" r="52" fill="none" stroke="#c9c0b4" stroke-width="1"/>
  <!-- uncertain contact (dashed) -->
  <path d="M38 96 C48 48, 112 48, 122 96" fill="none" stroke="#b4532a" stroke-width="2.2"
        stroke-dasharray="3.5 4.5" stroke-linecap="round"/>
  <!-- known contacts (solid) -->
  <path d="M38 96 L80 128 L122 96" fill="none" stroke="#243044" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes -->
  <circle cx="38" cy="96" r="5.5" fill="#243044"/>
  <circle cx="122" cy="96" r="5.5" fill="#243044"/>
  <circle cx="80" cy="128" r="5.5" fill="#243044"/>
  <!-- bundle: three blocks; middle is the extension (CPB) -->
  <rect x="58" y="54" width="44" height="10" rx="2" fill="#243044"/>
  <rect x="58" y="68" width="44" height="12" rx="2" fill="#b4532a"/>
  <rect x="58" y="84" width="44" height="10" rx="2" fill="#243044"/>
</svg>
