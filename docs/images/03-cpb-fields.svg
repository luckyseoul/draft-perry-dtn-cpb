<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">CPB data map: CBOR fields 0 through 8</title>
  <desc id="desc">Nine fields: default probability, per-path next hops as EIDs, creation time in milliseconds, mandatory producer node ID, validity in milliseconds, metric type, profile-defined confidence, format version, and profile.</desc>
  <style>
    text { font-family: sans-serif; }
    .heading { font-size: 26px; font-weight: 700; fill: #17191c; }
    .name { font-size: 21px; font-weight: 700; fill: #242629; }
    .detail { font-size: 17px; fill: #555b64; }
    .key { font-size: 29px; font-weight: 700; fill: white; text-anchor: middle; }
    .label { fill: #1971e6; stroke: #1558b0; stroke-width: 2; }
    .cell { fill: #f7f8fa; stroke: #d9dce1; stroke-width: 2; }
  </style>
  <rect width="1200" height="780" fill="white"/>
  <text class="heading" x="600" y="39" text-anchor="middle">CPB data map (CBOR fields 0–8)</text>
  <defs><g id="row"><rect class="label" x="30" width="120" height="70" rx="6"/><rect class="cell" x="160" width="1010" height="70" rx="6"/></g></defs>
  <g transform="translate(0 75)"><use href="#row"/><text class="key" x="90" y="46">0</text><text class="name" x="184" y="29">Default probability</text><text class="detail" x="184" y="54">The producer's estimate for the bundle destination</text></g>
  <g transform="translate(0 151)"><use href="#row"/><text class="key" x="90" y="46">1</text><text class="name" x="184" y="29">Per-path array</text><text class="detail" x="184" y="54">[next-hop eid, probability]; one entry per node; SHOULD NOT exceed 8</text></g>
  <g transform="translate(0 227)"><use href="#row"/><text class="key" x="90" y="46">2</text><text class="name" x="184" y="29">Creation time</text><text class="detail" x="184" y="54">DTN time in milliseconds; absent or 0 = undated</text></g>
  <g transform="translate(0 303)"><use href="#row"/><text class="key" x="90" y="46">3</text><text class="name" x="184" y="29">Producer (mandatory)</text><text class="detail" x="184" y="54">Node ID as an eid; authenticated only by a matching BIB security source</text></g>
  <g transform="translate(0 379)"><use href="#row"/><text class="key" x="90" y="46">4</text><text class="name" x="184" y="29">Validity duration</text><text class="detail" x="184" y="54">Milliseconds after field 2; requires a nonzero creation time</text></g>
  <g transform="translate(0 455)"><use href="#row"/><text class="key" x="90" y="46">5</text><text class="name" x="184" y="29">Metric type</text><text class="detail" x="184" y="54">0 PRoPHET · 1 CGR · 2 MaxProp · 3 RAPID · 4 generic (0–255)</text></g>
  <g transform="translate(0 531)"><use href="#row"/><text class="key" x="90" y="46">6</text><text class="name" x="184" y="29">Confidence</text><text class="detail" x="184" y="54">Defined by the profile; unused in the default profile</text></g>
  <g transform="translate(0 607)"><use href="#row"/><text class="key" x="90" y="46">7</text><text class="name" x="184" y="29">Format version</text><text class="detail" x="184" y="54">1 = this specification; other versions are unusable</text></g>
  <g transform="translate(0 683)"><use href="#row"/><text class="key" x="90" y="46">8</text><text class="name" x="184" y="29">Profile</text><text class="detail" x="184" y="54">Absent or 0 = the default profile defined in the draft</text></g>
</svg>
