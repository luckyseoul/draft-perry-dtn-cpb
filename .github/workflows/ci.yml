name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-cpb:
    name: CPB conformance tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test extras (cbor2)
        run: |
          python -m pip install --upgrade pip
          cd impl
          pip install -e '.[test]'

      - name: Run conformance and repository tests
        run: |
          python3 impl/test_cpb.py
          python3 impl/test_cpb_validation.py
          python3 impl/test_config1_policies.py
          python3 impl/test_sim_cpb_bridge.py
          python3 impl/test_draft_consistency.py

      - name: Verify packaging import
        run: python3 -c "import cpb; print('cpb package import OK')"

      - name: Compile all shipped Python artifacts
        run: python3 -m compileall -q impl examples

  build-draft:
    name: Build Internet-Draft (xml2rfc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install xml2rfc
        run: |
          python -m pip install --upgrade pip
          pip install 'xml2rfc==3.35.0'

      - name: Install and run CDDL validator
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/anweiss/cddl/releases/download/v0.10.6/cddl-linux-amd64.tar.gz \
            -o /tmp/cddl-linux-amd64.tar.gz
          echo "80d23a95cfcf7aba998f45d611f46bd2abf2898f0ca5a0aea375217a5ff548af  /tmp/cddl-linux-amd64.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/cddl-linux-amd64.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cddl-linux-amd64 /usr/local/bin/cddl
          cddl compile-cddl --cddl impl/cpb.cddl

      - name: Build text and HTML from XML
        run: |
          set -euo pipefail
          xml2rfc --version
          xml2rfc --text draft-perry-dtn-cpb.xml -o /tmp/draft-perry-dtn-cpb.txt
          xml2rfc --html draft-perry-dtn-cpb.xml -o /tmp/draft-perry-dtn-cpb.html
          grep -q 'Probabilistic Contact Metadata for DTN Bundle Routing' /tmp/draft-perry-dtn-cpb.txt

      # txt from xml2rfc 3.35.0 is byte-stable. HTML differs only in the
      # generator comment, which records the interpreter and library versions.
      - name: Check committed text and HTML match the XML
        run: |
          set -euo pipefail
          diff -u draft-perry-dtn-cpb.txt /tmp/draft-perry-dtn-cpb.txt
          python3 - <<'PY'
          import difflib
          import re
          from pathlib import Path

          def norm(path):
              text = Path(path).read_text(encoding="utf-8")
              return re.sub(
                  r"<!-- Generator version information:.*?-->",
                  "<!-- Generator version information: omitted -->",
                  text,
                  count=1,
                  flags=re.S,
              )

          committed = norm("draft-perry-dtn-cpb.html")
          built = norm("/tmp/draft-perry-dtn-cpb.html")
          if committed != built:
              diff = "".join(difflib.unified_diff(
                  committed.splitlines(True),
                  built.splitlines(True),
                  fromfile="draft-perry-dtn-cpb.html",
                  tofile="/tmp/draft-perry-dtn-cpb.html",
              ))
              raise SystemExit(diff[:8000] or "HTML differs from the XML rebuild")
          PY

      - name: Upload built draft artifacts
        uses: actions/upload-artifact@v7
        with:
          name: draft-build
          path: |
            /tmp/draft-perry-dtn-cpb.txt
            /tmp/draft-perry-dtn-cpb.html
          if-no-files-found: error
