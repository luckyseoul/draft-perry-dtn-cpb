name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-cpb:
    name: CPB conformance tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test extras (cbor2)
        run: |
          python -m pip install --upgrade pip
          cd impl
          pip install -e '.[test]'

      - name: Run conformance and repository tests
        run: python3 -m pytest -q impl

      - name: Verify packaging import
        run: python3 -c "import cpb; print('cpb package import OK')"

      - name: Compile all shipped Python artifacts
        run: python3 -m compileall -q impl examples

  build-draft:
    name: Build Internet-Draft (xml2rfc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xml2rfc
        run: |
          python -m pip install --upgrade pip
          pip install 'xml2rfc>=3.23.0'

      - name: Install and run CDDL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y cddl
          cddl compile-cddl --cddl impl/cpb.cddl

      - name: Build text and HTML from XML
        run: |
          set -euo pipefail
          xml2rfc --version
          xml2rfc --text draft-perry-dtn-cpb.xml -o /tmp/draft-perry-dtn-cpb.txt
          xml2rfc --html draft-perry-dtn-cpb.xml -o /tmp/draft-perry-dtn-cpb.html
          grep -q 'Bundle Protocol Contact Probability Block' /tmp/draft-perry-dtn-cpb.txt

      - name: Upload built draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: draft-build
          path: |
            /tmp/draft-perry-dtn-cpb.txt
            /tmp/draft-perry-dtn-cpb.html
          if-no-files-found: error
